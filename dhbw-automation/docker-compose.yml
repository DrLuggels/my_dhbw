version: '3.8'

services:
  # =============================================================================
  # Database - MariaDB
  # =============================================================================
  mariadb:
    image: mariadb:11.2
    container_name: dhbw-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: dhbw_automation
      MARIADB_USER: dhbw_user
      MARIADB_PASSWORD: dhbw_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - dhbw-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Cache - Redis
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: dhbw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dhbw-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # Object Storage - MinIO
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: dhbw-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - dhbw-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Bucket Creation
  minio-setup:
    image: minio/mc:latest
    container_name: dhbw-minio-setup
    depends_on:
      - minio
    networks:
      - dhbw-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/dhbw-files;
      /usr/bin/mc mb myminio/dhbw-backups;
      /usr/bin/mc mb myminio/dhbw-images;
      /usr/bin/mc mb myminio/dhbw-nextcloud-cache;
      /usr/bin/mc anonymous set download myminio/dhbw-files;
      exit 0;
      "

  # =============================================================================
  # Message Queue - RabbitMQ
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: dhbw-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dhbw-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # Vector Database - Qdrant (für semantische Suche)
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dhbw-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dhbw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Backend API (.NET) - Wird lokal gestartet für Development
  # =============================================================================
  # Uncomment für vollständiges Docker Setup
  # backend:
  #   build:
  #     context: ./src/Backend
  #     dockerfile: ../../docker/backend.Dockerfile
  #   container_name: dhbw-backend
  #   restart: unless-stopped
  #   ports:
  #     - "5000:80"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionStrings__DefaultConnection=Server=mariadb;Database=dhbw_automation;User=dhbw_user;Password=dhbw_password;
  #     - Redis__Host=redis
  #     - RabbitMQ__Host=rabbitmq
  #     - MinIO__Endpoint=minio:9000
  #   depends_on:
  #     - mariadb
  #     - redis
  #     - rabbitmq
  #     - minio
  #   networks:
  #     - dhbw-network

  # =============================================================================
  # Frontend (Vue.js) - Wird lokal gestartet für Development
  # =============================================================================
  # Uncomment für vollständiges Docker Setup
  # frontend:
  #   build:
  #     context: ./src/Frontend
  #     dockerfile: ../../docker/frontend.Dockerfile
  #   container_name: dhbw-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - dhbw-network

  # =============================================================================
  # pgAdmin (optional - für DB Management)
  # =============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dhbw-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - mariadb
    networks:
      - dhbw-network

  # =============================================================================
  # Monitoring - Prometheus (optional)
  # =============================================================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: dhbw-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   networks:
  #     - dhbw-network

  # =============================================================================
  # Monitoring - Grafana (optional)
  # =============================================================================
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: dhbw-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - dhbw-network

# =============================================================================
# Networks
# =============================================================================
networks:
  dhbw-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
