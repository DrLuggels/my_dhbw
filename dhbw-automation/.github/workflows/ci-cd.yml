name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # =============================================================================
  # Backend Tests
  # =============================================================================
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: dhbw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: 📦 Restore Dependencies
        run: |
          cd src/Backend
          dotnet restore
      
      - name: 🏗️ Build
        run: |
          cd src/Backend
          dotnet build --no-restore --configuration Release
      
      - name: 🧪 Run Tests
        run: |
          cd tests/Backend.Tests
          dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
      
      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./tests/Backend.Tests/coverage.cobertura.xml
          flags: backend

  # =============================================================================
  # Frontend Tests
  # =============================================================================
  frontend-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Frontend/package-lock.json
      
      - name: 📦 Install Dependencies
        run: |
          cd src/Frontend
          npm ci
      
      - name: 🔍 Lint
        run: |
          cd src/Frontend
          npm run lint
      
      - name: 🏗️ Build
        run: |
          cd src/Frontend
          npm run build
      
      - name: 🧪 Run Unit Tests
        run: |
          cd src/Frontend
          npm run test:unit
      
      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./src/Frontend/coverage/lcov.info
          flags: frontend

  # =============================================================================
  # Docker Build
  # =============================================================================
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/Backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dhbw-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/dhbw-backend:${{ github.sha }}
      
      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/Frontend
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dhbw-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/dhbw-frontend:${{ github.sha }}

  # =============================================================================
  # Security Scan
  # =============================================================================
  security-scan:
    name: Security - Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔒 Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
      
      - name: 🔐 .NET Security Scan
        run: |
          cd src/Backend
          dotnet list package --vulnerable --include-transitive

  # =============================================================================
  # Deploy to Staging
  # =============================================================================
  deploy-staging:
    name: Deploy - Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.dhbw-automation.example.com
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy to Staging
        run: |
          echo "Deploying to staging..."
          # Add your deployment script here
          # e.g., kubectl apply, docker-compose pull, etc.

  # =============================================================================
  # E2E Tests (after staging deployment)
  # =============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install Playwright
        run: |
          cd tests/Frontend.Tests
          npm ci
          npx playwright install --with-deps
      
      - name: 🧪 Run E2E Tests
        run: |
          cd tests/Frontend.Tests
          npm run test:e2e
        env:
          BASE_URL: https://staging.dhbw-automation.example.com
      
      - name: 📸 Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: tests/Frontend.Tests/playwright-report/
          retention-days: 30
