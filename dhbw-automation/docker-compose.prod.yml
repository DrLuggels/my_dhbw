version: '3.8'

services:
  # =============================================================================
  # Database - MariaDB
  # =============================================================================
  mariadb:
    image: mariadb:11.2
    container_name: dhbw-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: dhbw_automation
      MARIADB_USER: dhbw_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dhbw_password}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dhbw-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Cache - Redis
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: dhbw-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - dhbw-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # Object Storage - MinIO
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: dhbw-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - dhbw-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Bucket Creation
  minio-setup:
    image: minio/mc:latest
    container_name: dhbw-minio-setup
    depends_on:
      - minio
    networks:
      - dhbw-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/dhbw-files;
      /usr/bin/mc mb myminio/dhbw-backups;
      /usr/bin/mc anonymous set download myminio/dhbw-files;
      exit 0;
      "

  # =============================================================================
  # Message Queue - RabbitMQ
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: dhbw-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dhbw-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # Vector Database - Qdrant
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dhbw-qdrant
    restart: unless-stopped
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dhbw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Backend API (.NET 8) - COMMENTED OUT (entwicklung im Gange)
  # =============================================================================
  # backend:
  #   build:
  #     context: .
  #     dockerfile: docker/backend.Dockerfile
  #   container_name: dhbw-backend
  #   restart: unless-stopped
  #   ports:
  #     - "5000:80"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ASPNETCORE_URLS=http://+:80
  #     - ConnectionStrings__DefaultConnection=Server=mariadb;Database=dhbw_automation;User=dhbw_user;Password=${MARIADB_PASSWORD:-dhbw_password};
  #     - Redis__Host=redis
  #     - Redis__Port=6379
  #     - RabbitMQ__Host=rabbitmq
  #     - RabbitMQ__Port=5672
  #     - RabbitMQ__Username=${RABBITMQ_USER:-guest}
  #     - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
  #     - MinIO__Endpoint=minio:9000
  #     - MinIO__AccessKey=${MINIO_ROOT_USER:-minioadmin}
  #     - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
  #     - Qdrant__Host=qdrant
  #     - Qdrant__Port=6333
  #   depends_on:
  #     mariadb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   networks:
  #     - dhbw-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:80/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # =============================================================================
  # Frontend (Vue.js 3)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: dhbw-frontend
    restart: unless-stopped
    ports:
      - "8091:80"
    networks:
      - dhbw-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Database Management - phpMyAdmin
  # =============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dhbw-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - mariadb
    networks:
      - dhbw-network

# =============================================================================
# Networks
# =============================================================================
networks:
  dhbw-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  qdrant_data:
    driver: local
