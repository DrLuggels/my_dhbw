services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dhbw-postgres
    environment:
      POSTGRES_DB: dhbw_automation
      POSTGRES_USER: dhbw_user
      POSTGRES_PASSWORD: dhbw_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhbw_user -d dhbw_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
