services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dhbw-postgres
    environment:
      POSTGRES_DB: dhbw_automation
      POSTGRES_USER: dhbw_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhbw_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhbw_user -d dhbw_automation"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: dhbw-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dhbw_user:${POSTGRES_PASSWORD:-dhbw_secret}@db:5432/dhbw_automation
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.178.198}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: dhbw-frontend
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: dhbw-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
